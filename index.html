<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXNC</title>
<meta name="description" content="NEXNC is an aspiring systems engineer learning Rust, C++, C, Python and Nix, and running NixOS for 4 to 5 years.">
<link rel="me" href="https://sifa.id/p/nexnc.com">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text y='70' x='10' fill='%2300d4ff' font-family='monospace' font-weight='bold' font-size='70'>&gt;_</text></svg>">
<style>
  :root {
    --bg: #f3f5f4;
    --ink: #17211f;
    --muted: #5d6b68;
    --rule: #cfd8d5;
    --accent: #0b6e6e;
    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141b1a; --ink: #e6ece9; --muted: #8fa09b; --rule: #2b3836; --accent: #5fd0c4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141b1a; --ink: #e6ece9; --muted: #8fa09b; --rule: #2b3836; --accent: #5fd0c4;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 0 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(4rem, 20vw, 8rem);
    font-weight: 800;
    letter-spacing: -0.06em;
    line-height: 0.95;
  }
  h1 span { color: var(--accent); }
  .role { margin: 1.25rem 0 2.5rem; color: var(--muted); }
  nav { border-top: 1px solid var(--rule); }
  nav a {
    display: block;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    text-decoration: none;
  }
  nav a:hover { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  footer {
    max-width: 40rem;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { color: var(--muted); text-underline-offset: 3px; }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>nex<span>nc</span></h1>
  <p class="role">Aspiring systems engineer.<br>Rust, C++, C, Python and Nix.</p>
  <nav aria-label="Primary">
    <a href="/notes">Notes</a>
    <a href="/git">Git</a>
    <a href="https://me.nexnc.com">Links</a>
    <a href="cv.pdf" target="_blank" rel="noopener noreferrer">CV</a>
    <a href="mailto:hi@nexnc.com">Contact</a>
  </nav>
</main>
<footer><a href="/LICENSE">AGPLv3</a> &middot; &copy; 2026</footer>
</body>
</html>
